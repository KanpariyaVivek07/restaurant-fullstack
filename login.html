<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Gourmet Delight</title>
    <!-- <link rel="stylesheet" href="style.css"> -->
    <link rel="stylesheet" href="login.css">
    <link rel="shortcut icon" href="image/short_icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
</head>

<body>
    <div class="hero">
        <div class="login_form">
            <h1>Welcome Back</h1>
            <form class="input_box" id="loginForm">
                <div class="form_group">
                    <i class="fas fa-user"></i>
                    <input type="text" class="field" placeholder="Username or Email" id="username" required>
                </div>
                <div class="form_group">
                    <i class="fas fa-lock"></i>
                    <input type="password" class="field" placeholder="Password" id="password" required>
                    <i class="fas fa-eye toggle-password" onclick="togglePasswordVisibility('password', this)"></i>
                </div>
                <div class="remember_forgot">
                    <label class="remember_me">
                        <input type="checkbox" class="check_box">
                        <span>Remember me</span>
                    </label>
                    <a href="#" class="forgot_password">Forgot password?</a>
                </div>
                <button type="submit" class="submit_btn">
                    <span>Login</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
                <div class="divider">
                    <span>or continue with</span>
                </div>
                <div class="social_icon">
                    <a href="#" class="social_btn google"><i class="fab fa-google"></i></a>
                    <a href="#" class="social_btn facebook"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" class="social_btn twitter"><i class="fab fa-twitter"></i></a>
                </div>
                <div class="tag">
                    <span>Don't have an account?</span>
                    <a href="singup.html">Sign up</a>
                </div>
            </form>
        </div>
    </div>

    <div id="notification" class="alert"></div>

    <script src="auth.js"></script>
</body>

</html>
