<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Gourmet Delight</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="singup.css">
    <link rel="shortcut icon" href="image/short_icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css">
</head>

<body>
    <div class="hero">
        <div class="login_form">
            <h1>Create Account</h1>
            <form class="input_box" id="signupForm">
                <div class="form_group">
                    <i class="fas fa-user"></i>
                    <input type="text" class="field" placeholder="Full Name" id="fullname" required>
                </div>
                <div class="form_group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" class="field" placeholder="Email Address" id="email" required>
                </div>
                <div class="form_group">
                    <i class="fas fa-phone"></i>
                    <input type="tel" class="field" placeholder="Phone Number" id="phone">
                </div>
                <div class="form_group">
                    <i class="fas fa-map-marker-alt"></i>
                    <textarea class="field" placeholder="Address" id="address" rows="2"></textarea>
                </div>
                <div class="form_group">
                    <i class="fas fa-lock"></i>
                    <input type="password" class="field" placeholder="Password" id="signupPassword" required>
                    <i class="fas fa-eye toggle-password"
                        onclick="togglePasswordVisibility('signupPassword', this)"></i>
                </div>
                <div class="form_group">
                    <i class="fas fa-lock"></i>
                    <input type="password" class="field" placeholder="Confirm Password" id="confirmPassword" required>
                    <i class="fas fa-eye toggle-password"
                        onclick="togglePasswordVisibility('confirmPassword', this)"></i>
                </div>
                <div class="terms_conditions">
                    <input type="checkbox" id="terms" required>
                    <label for="terms">I agree to the <a href="#">Terms & Conditions</a> and <a href="#">Privacy
                            Policy</a></label>
                </div>
                <button type="submit" class="submit_btn">
                    <span>Sign Up</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
                <div class="divider">
                    <span>or sign up with</span>
                </div>
                <div class="social_icon">
                    <a href="#" class="social_btn google"><i class="fab fa-google"></i></a>
                    <a href="#" class="social_btn facebook"><i class="fab fa-facebook-f"></i></a>
                    <a href="#" class="social_btn twitter"><i class="fab fa-twitter"></i></a>
                </div>
                <div class="tag">
                    <span>Already have an account?</span>
                    <a href="login.html">Login</a>
                </div>
            </form>
        </div>
    </div>

    <div id="notification" class="alert"></div>

    <script src="auth.js"></script>
</body>

</html>
